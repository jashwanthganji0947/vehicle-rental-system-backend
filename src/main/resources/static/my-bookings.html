<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Bookings - Vehicle Rental System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="index.html">

                Vehicle Rental

            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="index.html">

                            Home

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="vehicles.html">

                            Vehicles

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="my-bookings.html">

                            My Bookings

                        </a>

                    </li>

                    <li class="nav-item">

                        <button
                            class="btn btn-outline-light ms-lg-2"
                            onclick="logout()">

                            Logout

                        </button>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- PAGE HEADER -->
    <section class="bg-dark text-white py-5">

        <div class="container text-center">

            <h1 class="fw-bold">
                My Bookings
            </h1>

            <p class="mb-0">
                View your vehicle rental bookings.
            </p>

        </div>

    </section>


    <!-- BOOKINGS -->
    <section class="container py-5">

        <div
            id="loadingMessage"
            class="text-center">

            <div
                class="spinner-border text-primary"
                role="status">
            </div>

            <p class="mt-3">
                Loading your bookings...
            </p>

        </div>


        <div
            id="errorMessage"
            class="alert alert-danger d-none"
            role="alert">
        </div>


        <div
            id="noBookingsMessage"
            class="alert alert-info d-none text-center">

            <h5>
                No bookings found
            </h5>

            <p>
                You have not made any vehicle bookings yet.
            </p>

            <a
                href="vehicles.html"
                class="btn btn-primary">

                Browse Vehicles

            </a>

        </div>


        <div
            id="bookingContainer"
            class="row g-4">

        </div>

    </section>


    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-4">

        <div class="container">

            <p class="mb-0">
                © 2026 Vehicle Rental System
            </p>

        </div>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <script>

        // --------------------------------------------------
        // CHECK LOGIN
        // --------------------------------------------------

        const userId =
            sessionStorage.getItem("userId");

        if (!userId) {

            window.location.href =
                "login.html";

        }


        // --------------------------------------------------
        // LOGOUT
        // --------------------------------------------------

        function logout() {

            sessionStorage.clear();

            window.location.href =
                "login.html";

        }


        // --------------------------------------------------
        // LOAD BOOKINGS
        // --------------------------------------------------

        async function loadBookings() {

            const loadingMessage =
                document.getElementById(
                    "loadingMessage"
                );

            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );

            const noBookingsMessage =
                document.getElementById(
                    "noBookingsMessage"
                );

            const bookingContainer =
                document.getElementById(
                    "bookingContainer"
                );


            try {

                console.log(
                    "Logged-in user ID:",
                    userId
                );


                const response =
                    await fetch(
                        "/api/bookings/user/" +
                        encodeURIComponent(userId)
                    );


                console.log(
                    "Bookings API status:",
                    response.status
                );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        errorText ||
                        "Unable to load bookings"
                    );

                }


                const bookings =
                    await response.json();


                console.log(
                    "Bookings received:",
                    bookings
                );


                loadingMessage.classList.add(
                    "d-none"
                );


                if (
                    !Array.isArray(bookings) ||
                    bookings.length === 0
                ) {

                    noBookingsMessage.classList.remove(
                        "d-none"
                    );

                    return;

                }


                bookings.forEach(
                    booking => {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "col-md-6 col-lg-4";


                        const paymentBadge =
                            booking.paymentStatus === "PAID"
                            ? "bg-success"
                            : "bg-warning text-dark";


                        const bookingBadge =
                            booking.bookingStatus === "CONFIRMED"
                            ? "bg-success"
                            : "bg-warning text-dark";


                        card.innerHTML = `

                            <div
                                class="card h-100 shadow-sm">

                                <div
                                    class="card-body">

                                    <div
                                        class="d-flex justify-content-between align-items-start">

                                        <h5
                                            class="card-title fw-bold">

                                            ${booking.vehicle.name}

                                        </h5>

                                        <span
                                            class="badge ${bookingBadge}">

                                            ${booking.bookingStatus}

                                        </span>

                                    </div>


                                    <p
                                        class="text-muted">

                                        ${booking.vehicle.brand}
                                        ${booking.vehicle.model}

                                    </p>


                                    <hr>


                                    <p>

                                        <strong>
                                            Booking ID:
                                        </strong>

                                        ${booking.id}

                                    </p>


                                    <p>

                                        <strong>
                                            Start Date:
                                        </strong>

                                        ${booking.startDate}

                                    </p>


                                    <p>

                                        <strong>
                                            End Date:
                                        </strong>

                                        ${booking.endDate}

                                    </p>


                                    <p>

                                        <strong>
                                            Total Amount:
                                        </strong>

                                        ₹${booking.totalAmount}

                                    </p>


                                    <p>

                                        <strong>
                                            Payment:
                                        </strong>

                                        <span
                                            class="badge ${paymentBadge}">

                                            ${booking.paymentStatus}

                                        </span>

                                    </p>


                                    <a
                                        href="booking-confirmation.html?bookingId=${booking.id}"
                                        class="btn btn-primary w-100 mt-2">

                                        View Booking

                                    </a>

                                </div>

                            </div>

                        `;


                        bookingContainer.appendChild(
                            card
                        );

                    }
                );

            }


            catch (error) {

                console.error(
                    "Booking loading error:",
                    error
                );


                loadingMessage.classList.add(
                    "d-none"
                );


                errorMessage.classList.remove(
                    "d-none"
                );


                errorMessage.textContent =
                    "Unable to load bookings: " +
                    error.message;

            }

        }


        // --------------------------------------------------
        // START
        // --------------------------------------------------

        if (userId) {

            loadBookings();

        }

    </script>

</body>

</html>
