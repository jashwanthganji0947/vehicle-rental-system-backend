<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Vehicles - Vehicle Rental System</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="index.html">

                Vehicle Rental

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <!-- Home -->
                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="index.html">

                            Home

                        </a>

                    </li>


                    <!-- Vehicles -->
                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="vehicles.html">

                            Vehicles

                        </a>

                    </li>


                    <!-- My Bookings -->
                    <li
                        class="nav-item"
                        id="myBookingsNav">

                        <a
                            class="nav-link"
                            href="my-bookings.html">

                            My Bookings

                        </a>

                    </li>


                    <!-- Login -->
                    <li
                        class="nav-item"
                        id="loginNav">

                        <a
                            class="nav-link"
                            href="login.html">

                            Login

                        </a>

                    </li>


                    <!-- Register -->
                    <li
                        class="nav-item"
                        id="registerNav">

                        <a
                            class="btn btn-primary ms-lg-2"
                            href="register.html">

                            Register

                        </a>

                    </li>


                    <!-- Logout -->
                    <li
                        class="nav-item"
                        id="logoutNav">

                        <button
                            class="btn btn-outline-light ms-lg-2"
                            onclick="logout()">

                            Logout

                        </button>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Page Header -->
    <section class="bg-dark text-white py-5">

        <div class="container text-center">

            <h1 class="fw-bold">
                Available Vehicles
            </h1>

            <p class="mb-0">
                Choose the vehicle that suits your journey.
            </p>

        </div>

    </section>


    <!-- Vehicles Section -->
    <section class="container py-5">

        <!-- Loading Message -->
        <div
            id="loadingMessage"
            class="text-center">

            <div
                class="spinner-border text-primary"
                role="status">
            </div>

            <p class="mt-3">
                Loading vehicles...
            </p>

        </div>


        <!-- Error Message -->
        <div
            id="errorMessage"
            class="alert alert-danger d-none"
            role="alert">
        </div>


        <!-- Vehicle Cards -->
        <div
            id="vehicleContainer"
            class="row g-4">

        </div>

    </section>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">

        <div class="container">

            <p class="mb-0">
                © 2026 Vehicle Rental System
            </p>

        </div>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Vehicle JavaScript -->
    <script>

        /*
         * ==========================================
         * NAVIGATION
         * ==========================================
         */

        const loggedInUserId =
            sessionStorage.getItem("userId");

        const loggedInUserRole =
            sessionStorage.getItem("userRole");


        const loginNav =
            document.getElementById(
                "loginNav"
            );


        const registerNav =
            document.getElementById(
                "registerNav"
            );


        const myBookingsNav =
            document.getElementById(
                "myBookingsNav"
            );


        const logoutNav =
            document.getElementById(
                "logoutNav"
            );


        /*
         * Hide/show navigation items
         */
        if (loggedInUserId) {

            /*
             * User is logged in
             */

            loginNav.classList.add(
                "d-none"
            );


            registerNav.classList.add(
                "d-none"
            );


            myBookingsNav.classList.remove(
                "d-none"
            );


            logoutNav.classList.remove(
                "d-none"
            );

        }

        else {

            /*
             * User is not logged in
             */

            myBookingsNav.classList.add(
                "d-none"
            );


            logoutNav.classList.add(
                "d-none"
            );


            loginNav.classList.remove(
                "d-none"
            );


            registerNav.classList.remove(
                "d-none"
            );

        }


        /*
         * ==========================================
         * LOGOUT
         * ==========================================
         */

        function logout() {

            sessionStorage.clear();

            window.location.href =
                "login.html";

        }


        /*
         * ==========================================
         * VEHICLE API
         * ==========================================
         */

        const API_URL =
            "/api/vehicles";


        /*
         * ==========================================
         * LOAD VEHICLES
         * ==========================================
         */

        async function loadVehicles() {

            const loadingMessage =
                document.getElementById(
                    "loadingMessage"
                );


            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );


            const vehicleContainer =
                document.getElementById(
                    "vehicleContainer"
                );


            try {

                const response =
                    await fetch(
                        API_URL
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load vehicles"
                    );

                }


                const vehicles =
                    await response.json();


                /*
                 * Hide loading
                 */
                loadingMessage.classList.add(
                    "d-none"
                );


                /*
                 * No vehicles
                 */
                if (
                    vehicles.length === 0
                ) {

                    vehicleContainer.innerHTML = `

                        <div class="col-12 text-center">

                            <div class="alert alert-info">

                                No vehicles are currently available.

                            </div>

                        </div>

                    `;

                    return;

                }


                /*
                 * Display vehicles
                 */
                vehicles.forEach(
                    vehicle => {

                        const vehicleCard =
                            document.createElement(
                                "div"
                            );


                        vehicleCard.className =
                            "col-md-6 col-lg-4";


                        vehicleCard.innerHTML = `

                            <div class="card h-100 shadow-sm">

                                <div class="card-body">

                                    <div
                                        class="d-flex justify-content-between">

                                        <h4
                                            class="card-title fw-bold">

                                            ${vehicle.name}

                                        </h4>


                                        <span
                                            class="badge ${
                                                vehicle.available
                                                ? "bg-success"
                                                : "bg-danger"
                                            }">

                                            ${
                                                vehicle.available
                                                ? "Available"
                                                : "Unavailable"
                                            }

                                        </span>

                                    </div>


                                    <p
                                        class="text-muted mb-2">

                                        ${vehicle.brand}
                                        ${vehicle.model}

                                    </p>


                                    <p>

                                        <strong>
                                            Type:
                                        </strong>

                                        ${vehicle.type}

                                    </p>


                                    <p>

                                        <strong>
                                            Registration:
                                        </strong>

                                        ${vehicle.registrationNumber}

                                    </p>


                                    <p
                                        class="text-muted">

                                        ${
                                            vehicle.description ||
                                            "No description available"
                                        }

                                    </p>


                                    <h5
                                        class="text-primary fw-bold">

                                        ₹${vehicle.pricePerDay}

                                        <small
                                            class="text-muted">

                                            / day

                                        </small>

                                    </h5>


                                    <button
                                        class="btn btn-primary w-100 mt-3"
                                        onclick="bookVehicle(${vehicle.id})"
                                        ${
                                            !vehicle.available
                                            ? "disabled"
                                            : ""
                                        }>

                                        Book Now

                                    </button>

                                </div>

                            </div>

                        `;


                        vehicleContainer.appendChild(
                            vehicleCard
                        );

                    }
                );

            }

            catch (error) {

                loadingMessage.classList.add(
                    "d-none"
                );


                errorMessage.classList.remove(
                    "d-none"
                );


                errorMessage.textContent =
                    error.message;

            }

        }


        /*
         * ==========================================
         * BOOK VEHICLE
         * ==========================================
         */

        function bookVehicle(vehicleId) {

            /*
             * If user is already logged in,
             * go directly to booking page.
             */
            if (loggedInUserId) {

                window.location.href =
                    "booking.html?vehicleId=" +
                    encodeURIComponent(
                        vehicleId
                    );

                return;

            }


            /*
             * User is not logged in.
             *
             * Send vehicle ID to login page
             * so it can be preserved after login.
             */
            window.location.href =
                "login.html?vehicleId=" +
                encodeURIComponent(
                    vehicleId
                );

        }


        /*
         * ==========================================
         * START
         * ==========================================
         */

        loadVehicles();

    </script>

</body>

</html>
