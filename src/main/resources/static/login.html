<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - Vehicle Rental System</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="index.html">

                Vehicle Rental

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="index.html">

                            Home

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="vehicles.html">

                            Vehicles

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="login.html">

                            Login

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="btn btn-primary ms-lg-2"
                            href="register.html">

                            Register

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Login Section -->
    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-5">

                <div class="card shadow-sm">

                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">

                            <h2 class="fw-bold">
                                Login
                            </h2>

                            <p class="text-muted">
                                Login to your Vehicle Rental account.
                            </p>

                        </div>


                        <!-- Success Message -->
                        <div
                            id="successMessage"
                            class="alert alert-success d-none"
                            role="alert">
                        </div>


                        <!-- Error Message -->
                        <div
                            id="errorMessage"
                            class="alert alert-danger d-none"
                            role="alert">
                        </div>


                        <!-- Login Form -->
                        <form id="loginForm">

                            <!-- Email -->
                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter your password"
                                    required>

                            </div>


                            <!-- Login Button -->
                            <button
                                type="submit"
                                id="loginButton"
                                class="btn btn-primary w-100 mt-3">

                                Login

                            </button>

                        </form>


                        <!-- Register Link -->
                        <div class="text-center mt-4">

                            <p class="mb-0">

                                Don't have an account?

                                <a href="register.html">
                                    Create an account
                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">

        <div class="container">

            <p class="mb-0">
                © 2026 Vehicle Rental System
            </p>

        </div>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Login JavaScript -->
    <script>

        /*
         * ==========================================
         * GET VEHICLE ID FROM URL
         * ==========================================
         *
         * Example:
         *
         * login.html?vehicleId=1
         *
         */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const selectedVehicleId =
            urlParams.get("vehicleId");


        /*
         * ==========================================
         * HTML ELEMENTS
         * ==========================================
         */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const successMessage =
            document.getElementById(
                "successMessage"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        /*
         * ==========================================
         * LOGIN
         * ==========================================
         */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                /*
                 * Get form values
                 */
                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                /*
                 * Clear messages
                 */
                successMessage.classList.add(
                    "d-none"
                );


                errorMessage.classList.add(
                    "d-none"
                );


                /*
                 * Disable button
                 */
                loginButton.disabled =
                    true;


                loginButton.textContent =
                    "Logging in...";


                try {

                    /*
                     * Send login request
                     */
                    const response =
                        await fetch(
                            "/api/auth/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email:
                                            email,

                                        password:
                                            password
                                    })
                            }
                        );


                    /*
                     * Handle failed login
                     */
                    if (!response.ok) {

                        const errorText =
                            await response.text();


                        throw new Error(
                            errorText ||
                            "Invalid email or password"
                        );

                    }


                    /*
                     * Get logged-in user
                     */
                    const user =
                        await response.json();


                    /*
                     * Save user information
                     */
                    sessionStorage.setItem(
                        "userId",
                        user.id
                    );


                    sessionStorage.setItem(
                        "userName",
                        user.name
                    );


                    sessionStorage.setItem(
                        "userEmail",
                        user.email
                    );


                    sessionStorage.setItem(
                        "userRole",
                        user.role
                    );


                    /*
                     * Success message
                     */
                    successMessage.textContent =
                        "Login successful! Redirecting...";


                    successMessage.classList.remove(
                        "d-none"
                    );


                    /*
                     * =================================
                     * REDIRECT BASED ON ROLE
                     * =================================
                     */

                    setTimeout(
                        function() {

                            /*
                             * ADMIN
                             */
                            if (
                                user.role ===
                                "ADMIN"
                            ) {

                                window.location.href =
                                    "admin-dashboard.html";

                                return;

                            }


                            /*
                             * NORMAL USER
                             *
                             * If the user clicked
                             * Book Now before login,
                             * send them directly
                             * to the booking page.
                             */
                            if (
                                selectedVehicleId
                            ) {

                                window.location.href =
                                    "booking.html?vehicleId=" +
                                    encodeURIComponent(
                                        selectedVehicleId
                                    );

                                return;

                            }


                            /*
                             * Normal user without
                             * selected vehicle.
                             */
                            window.location.href =
                                "vehicles.html";

                        },
                        1000
                    );

                }

                catch (error) {

                    errorMessage.textContent =
                        error.message ||
                        "Login failed. Please try again.";


                    errorMessage.classList.remove(
                        "d-none"
                    );

                }

                finally {

                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "Login";

                }

            }
        );

    </script>

</body>

</html>
