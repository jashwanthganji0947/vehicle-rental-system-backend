<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Booking - Vehicle Rental System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="index.html">

                Vehicle Rental

            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="index.html">

                            Home

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="vehicles.html">

                            Vehicles

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="my-bookings.html">

                            My Bookings

                        </a>

                    </li>

                    <li class="nav-item">

                        <button
                            class="btn btn-outline-light ms-lg-2"
                            onclick="logout()">

                            Logout

                        </button>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- ================= PAGE HEADER ================= -->

    <section class="bg-dark text-white py-5">

        <div class="container text-center">

            <h1 class="fw-bold">
                Create Booking
            </h1>

            <p class="mb-0">
                Select your rental dates and confirm your booking.
            </p>

        </div>

    </section>


    <!-- ================= BOOKING SECTION ================= -->

    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">


                <!-- Error / Success Message -->

                <div
                    id="message"
                    class="alert d-none"
                    role="alert">
                </div>


                <!-- Loading Vehicle -->

                <div
                    id="loadingMessage"
                    class="text-center mb-4">

                    <div
                        class="spinner-border text-primary"
                        role="status">
                    </div>

                    <p class="mt-3">
                        Loading vehicle details...
                    </p>

                </div>


                <!-- Vehicle Details -->

                <div
                    id="vehicleCard"
                    class="card shadow-sm mb-4 d-none">

                    <div class="card-body">

                        <div
                            class="d-flex justify-content-between align-items-start">

                            <div>

                                <h3
                                    id="vehicleName"
                                    class="fw-bold">
                                </h3>

                                <p
                                    id="vehicleBrandModel"
                                    class="text-muted mb-2">
                                </p>

                            </div>

                            <span
                                id="availabilityBadge"
                                class="badge">
                            </span>

                        </div>


                        <hr>


                        <div class="row">

                            <div class="col-md-6">

                                <p>

                                    <strong>
                                        Type:
                                    </strong>

                                    <span
                                        id="vehicleType">
                                    </span>

                                </p>

                            </div>


                            <div class="col-md-6">

                                <p>

                                    <strong>
                                        Price per Day:
                                    </strong>

                                    ₹<span
                                        id="pricePerDay">
                                    </span>

                                </p>

                            </div>

                        </div>


                        <p>

                            <strong>
                                Description:
                            </strong>

                            <span
                                id="vehicleDescription">
                            </span>

                        </p>

                    </div>

                </div>


                <!-- Booking Form -->

                <div
                    id="bookingCard"
                    class="card shadow-sm d-none">

                    <div class="card-header bg-primary text-white">

                        <h4 class="mb-0">
                            Rental Details
                        </h4>

                    </div>


                    <div class="card-body">

                        <form id="bookingForm">


                            <!-- Start Date -->

                            <div class="mb-3">

                                <label
                                    for="startDate"
                                    class="form-label fw-bold">

                                    Start Date

                                </label>

                                <input
                                    type="date"
                                    id="startDate"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- End Date -->

                            <div class="mb-3">

                                <label
                                    for="endDate"
                                    class="form-label fw-bold">

                                    End Date

                                </label>

                                <input
                                    type="date"
                                    id="endDate"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- Rental Days -->

                            <div class="alert alert-light border">

                                <div
                                    class="d-flex justify-content-between">

                                    <span>
                                        Rental Days
                                    </span>

                                    <strong
                                        id="numberOfDays">

                                        0

                                    </strong>

                                </div>


                                <div
                                    class="d-flex justify-content-between mt-2">

                                    <span>
                                        Price Per Day
                                    </span>

                                    <strong>

                                        ₹<span
                                            id="summaryPrice">
                                            0
                                        </span>

                                    </strong>

                                </div>


                                <hr>


                                <div
                                    class="d-flex justify-content-between">

                                    <span
                                        class="fw-bold">

                                        Total Amount

                                    </span>

                                    <strong
                                        class="text-primary">

                                        ₹<span
                                            id="totalAmount">
                                            0
                                        </span>

                                    </strong>

                                </div>

                            </div>


                            <!-- Create Booking -->

                            <button
                                type="submit"
                                id="createBookingButton"
                                class="btn btn-primary w-100">

                                Create Booking

                            </button>


                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer
        class="bg-dark text-white text-center py-4">

        <div class="container">

            <p class="mb-0">
                © 2026 Vehicle Rental System
            </p>

        </div>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <script>

        // ==================================================
        // USER INFORMATION
        // ==================================================

        const userId =
            sessionStorage.getItem("userId");


        const vehicleId =
            new URLSearchParams(
                window.location.search
            ).get("vehicleId");


        let vehiclePrice = 0;


        // ==================================================
        // CHECK LOGIN
        // ==================================================

        if (!userId) {

            window.location.href =
                "login.html?vehicleId=" +
                encodeURIComponent(vehicleId || "");

        }


        // ==================================================
        // LOGOUT
        // ==================================================

        function logout() {

            sessionStorage.clear();

            window.location.href =
                "login.html";

        }


        // ==================================================
        // ELEMENTS
        // ==================================================

        const loadingMessage =
            document.getElementById(
                "loadingMessage"
            );


        const vehicleCard =
            document.getElementById(
                "vehicleCard"
            );


        const bookingCard =
            document.getElementById(
                "bookingCard"
            );


        const message =
            document.getElementById(
                "message"
            );


        const vehicleName =
            document.getElementById(
                "vehicleName"
            );


        const vehicleBrandModel =
            document.getElementById(
                "vehicleBrandModel"
            );


        const vehicleType =
            document.getElementById(
                "vehicleType"
            );


        const vehicleDescription =
            document.getElementById(
                "vehicleDescription"
            );


        const pricePerDay =
            document.getElementById(
                "pricePerDay"
            );


        const summaryPrice =
            document.getElementById(
                "summaryPrice"
            );


        const availabilityBadge =
            document.getElementById(
                "availabilityBadge"
            );


        const startDateInput =
            document.getElementById(
                "startDate"
            );


        const endDateInput =
            document.getElementById(
                "endDate"
            );


        const numberOfDays =
            document.getElementById(
                "numberOfDays"
            );


        const totalAmount =
            document.getElementById(
                "totalAmount"
            );


        const createBookingButton =
            document.getElementById(
                "createBookingButton"
            );


        // ==================================================
        // SHOW MESSAGE
        // ==================================================

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "alert alert-" +
                type;

            message.classList.remove(
                "d-none"
            );

        }


        // ==================================================
        // HIDE MESSAGE
        // ==================================================

        function hideMessage() {

            message.classList.add(
                "d-none"
            );

            message.textContent =
                "";

        }


        // ==================================================
        // LOAD VEHICLE
        // ==================================================

        async function loadVehicle() {

            if (!vehicleId) {

                loadingMessage.classList.add(
                    "d-none"
                );

                showMessage(
                    "No vehicle was selected. Please go back to the Vehicles page.",
                    "danger"
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        "/api/vehicles/" +
                        encodeURIComponent(
                            vehicleId
                        )
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load vehicle details."
                    );

                }


                const vehicle =
                    await response.json();


                vehiclePrice =
                    Number(
                        vehicle.pricePerDay
                    );


                vehicleName.textContent =
                    vehicle.name;


                vehicleBrandModel.textContent =
                    vehicle.brand +
                    " " +
                    vehicle.model;


                vehicleType.textContent =
                    vehicle.type;


                vehicleDescription.textContent =
                    vehicle.description ||
                    "No description available";


                pricePerDay.textContent =
                    vehiclePrice;


                summaryPrice.textContent =
                    vehiclePrice;


                if (vehicle.available) {

                    availabilityBadge.textContent =
                        "Available";

                    availabilityBadge.className =
                        "badge bg-success";

                } else {

                    availabilityBadge.textContent =
                        "Unavailable";

                    availabilityBadge.className =
                        "badge bg-danger";

                    createBookingButton.disabled =
                        true;

                }


                loadingMessage.classList.add(
                    "d-none"
                );


                vehicleCard.classList.remove(
                    "d-none"
                );


                bookingCard.classList.remove(
                    "d-none"
                );


                // Minimum selectable date = today

                const today =
                    new Date()
                        .toISOString()
                        .split("T")[0];


                startDateInput.min =
                    today;


                endDateInput.min =
                    today;


            }


            catch (error) {

                loadingMessage.classList.add(
                    "d-none"
                );

                showMessage(
                    error.message,
                    "danger"
                );

            }

        }


        // ==================================================
        // CALCULATE TOTAL
        // ==================================================

        function calculateTotal() {

            const startDate =
                startDateInput.value;


            const endDate =
                endDateInput.value;


            if (
                !startDate ||
                !endDate
            ) {

                numberOfDays.textContent =
                    "0";

                totalAmount.textContent =
                    "0";

                return;

            }


            const start =
                new Date(
                    startDate + "T00:00:00"
                );


            const end =
                new Date(
                    endDate + "T00:00:00"
                );


            const difference =
                end.getTime() -
                start.getTime();


            if (difference < 0) {

                numberOfDays.textContent =
                    "0";

                totalAmount.textContent =
                    "0";

                return;

            }


            let days =
                Math.ceil(
                    difference /
                    (1000 * 60 * 60 * 24)
                );


            // Same-day rental = 1 day

            if (days === 0) {

                days = 1;

            }


            const total =
                days *
                vehiclePrice;


            numberOfDays.textContent =
                days;


            totalAmount.textContent =
                total;

        }


        // ==================================================
        // DATE CHANGE EVENTS
        // ==================================================

        startDateInput.addEventListener(
            "change",
            function() {

                hideMessage();

                if (startDateInput.value) {

                    endDateInput.min =
                        startDateInput.value;

                }

                calculateTotal();

            }
        );


        endDateInput.addEventListener(
            "change",
            function() {

                hideMessage();

                calculateTotal();

            }
        );


        // ==================================================
        // CREATE BOOKING
        // ==================================================

        document
            .getElementById("bookingForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    hideMessage();


                    const startDate =
                        startDateInput.value;


                    const endDate =
                        endDateInput.value;


                    // --------------------------------------
                    // Validate dates
                    // --------------------------------------

                    if (
                        !startDate ||
                        !endDate
                    ) {

                        showMessage(
                            "Please select both start date and end date.",
                            "danger"
                        );

                        return;

                    }


                    const start =
                        new Date(
                            startDate + "T00:00:00"
                        );


                    const end =
                        new Date(
                            endDate + "T00:00:00"
                        );


                    if (end < start) {

                        showMessage(
                            "End date cannot be before start date.",
                            "danger"
                        );

                        return;

                    }


                    // --------------------------------------
                    // Prevent past start date
                    // --------------------------------------

                    const today =
                        new Date();

                    today.setHours(
                        0,
                        0,
                        0,
                        0
                    );


                    if (start < today) {

                        showMessage(
                            "Start date cannot be in the past.",
                            "danger"
                        );

                        return;

                    }


                    // --------------------------------------
                    // Disable button
                    // --------------------------------------

                    createBookingButton.disabled =
                        true;


                    createBookingButton.textContent =
                        "Creating Booking...";


                    try {

                        const url =
                            "/api/bookings" +
                            "?userId=" +
                            encodeURIComponent(
                                userId
                            ) +
                            "&vehicleId=" +
                            encodeURIComponent(
                                vehicleId
                            ) +
                            "&startDate=" +
                            encodeURIComponent(
                                startDate
                            ) +
                            "&endDate=" +
                            encodeURIComponent(
                                endDate
                            );


                        const response =
                            await fetch(
                                url,
                                {
                                    method: "POST"
                                }
                            );


                        // ----------------------------------
                        // Handle API errors
                        // ----------------------------------

                        if (!response.ok) {

                            let errorText =
                                await response.text();


                            // Remove any accidental JSON
                            // formatting from the message.

                            try {

                                const errorJson =
                                    JSON.parse(
                                        errorText
                                    );

                                if (
                                    errorJson.message
                                ) {

                                    errorText =
                                        errorJson.message;

                                }

                            } catch (parseError) {

                                // Response was plain text.
                                // Keep it as it is.

                            }


                            throw new Error(
                                errorText ||
                                "Unable to create booking."
                            );

                        }


                        // ----------------------------------
                        // Successful booking
                        // ----------------------------------

                        const booking =
                            await response.json();


                        sessionStorage.setItem(
                            "bookingId",
                            booking.id
                        );


                        showMessage(
                            "Booking created successfully. Redirecting to payment...",
                            "success"
                        );


                        setTimeout(
                            function() {

                                window.location.href =
                                    "payment.html";

                            },
                            1000
                        );

                    }


                    catch (error) {

                        console.error(
                            "Booking error:",
                            error
                        );


                        showMessage(
                            error.message,
                            "danger"
                        );


                        createBookingButton.disabled =
                            false;


                        createBookingButton.textContent =
                            "Create Booking";

                    }

                }
            );


        // ==================================================
        // START
        // ==================================================

        loadVehicle();

    </script>

</body>

</html>
